services:
  - type: web
    name: luxestay-backend
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: luxestay-db
          property: connectionString
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: luxestay-db
    plan: free # or starter
